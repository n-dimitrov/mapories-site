<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="mapories.books — coming soon">
<meta property="og:description" content="Your trip, designed into a printed photobook.">
<meta property="og:image" content="https://maporiesbooks.com/assets/coming-soon.png">
<meta name="twitter:card" content="summary_large_image">
<title>mapories.books — coming soon</title>
<meta name="description" content="Your trip, designed into a printed photobook. Coming soon.">
<style>
  @font-face{font-family:Newsreader; src:url("fonts/newsreader.ttf") format("truetype"); font-weight:400; font-display:swap}
  @font-face{font-family:Archivo; src:url("fonts/archivo.ttf") format("truetype"); font-weight:400; font-display:swap}
  :root{--bg:#f4f2ec; --ink:#1f2933; --mut:#6b7684; --terra:#e0583a}
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{background:var(--bg); color:var(--ink); font:15px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100svh}
  header{padding:22px clamp(16px,4vw,40px)}
  header img{height:30px; width:auto; display:block}
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(20px,4vw,36px);
    padding:0 clamp(16px,4vw,40px) 48px}
  .hero{width:100%; max-width:1200px; aspect-ratio:1200/630; display:block; height:auto}
  .soon{text-align:center}
  .soon p:first-child{display:inline-flex; align-items:center; gap:10px; margin:0;
    font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--mut)}
  .soon p:first-child::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--terra)}
  .soon h1{font:400 clamp(34px,5vw,56px)/1.05 Newsreader,Georgia,serif; margin:10px 0 0; letter-spacing:-.005em}
</style>
</head>
<body>
<header><img src="assets/wordmark.svg" alt="mapories.books"></header>
<main>
  <img class="hero" src="assets/coming-soon.png" width="1200" height="630"
       alt="A Mapories photobook, “Winter Stones of Rome”, over a map of Italy — 1 country, 2 days, 32 pages.">
  <div class="soon">
    <p>Coming soon</p>
    <h1>Your trip, designed into a printed photobook.</h1>
  </div>
</main>
</body>
</html>
